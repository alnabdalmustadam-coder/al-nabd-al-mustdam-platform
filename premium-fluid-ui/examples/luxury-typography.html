<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Personal Luxury Typography Fluid Fixture</title>
<link rel="stylesheet" href="../assets/luxury-fluid-typography.css" />
<style>
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,sans-serif; background:#f5f6f9; color:#131924; }
main { inline-size:min(100% - 2rem,70rem); margin-inline:auto; padding-block:1rem 4rem; }
section { padding:1rem; background:white; border-radius:1rem; margin-block:1rem; }
h1,h2,h3,p { margin:0 0 .5em; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr)); gap:1rem; }
.card { min-inline-size:0; overflow:visible; }
.pf-fluid-art-shell { margin-top:1rem; inline-size: min(100%,26rem); border:1px solid #bbb; border-radius: .5rem; padding:.5rem; aspect-ratio: 3 / 1; display:flex; align-items:center; justify-content:space-around; }
.pf-fluid-art-title { white-space:nowrap; font-weight:800; }
</style>
</head>
<body><main>
<section><h1 class="pf-type-h1">لوحتك الاستثنائية تبدأ من هنا</h1><p class="pf-type-body">المنصة المعتمدة للمزادات بتنسيق مرن وخط عربي واضح.</p></section>
<div class="cards">
<section class="card"><h2 class="pf-type-h2">المزادات الحية</h2><p class="pf-type-body">وصف قصير يتناسب مع المساحة المتاحة.</p></section>
<section class="card"><h3 class="pf-type-h3">مزاد جديد</h3><p class="pf-type-caption">نص ثانوي</p><p class="pf-type-micro">حالة ثانوية</p></section>
</div>
<section><div class="pf-fluid-art-shell"><span class="pf-fluid-art-title">AAA</span><span class="pf-fluid-art-title">٣٣٣</span></div></section>
</main></body></html>
