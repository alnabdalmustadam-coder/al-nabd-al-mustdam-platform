<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proportional component — healthy</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f2f5fa;padding:1.5rem;margin:0}
.carousel{max-width:1000px;display:flex;gap:1rem;overflow:visible}
.card{container:card / inline-size;flex:0 0 auto;inline-size:320px;min-inline-size:0;padding:clamp(.55rem,2cqi,1rem);border-radius:1.2rem;background:#0b1930;color:white;display:grid;gap:.75rem;align-content:start}
.heading{font-size:1rem;line-height:1.5;margin:0;overflow-wrap:anywhere}
.art{container:plate / inline-size;inline-size:100%;aspect-ratio:3.18;position:relative;border:3px solid #a6abb3;border-radius:.65rem;background:#e7ebef;overflow:hidden;color:#131d2b}
.art .digits{position:absolute;left:5%;top:18%;width:36%;font:bold 12cqi/1 system-ui;letter-spacing:.01em;white-space:nowrap;text-align:center}
.art .letters{position:absolute;right:5%;top:18%;width:36%;font:bold 12cqi/1 system-ui;letter-spacing:.01em;white-space:nowrap;text-align:center}
.art .pillar{position:absolute;left:45%;top:0;width:10%;height:100%;background:#e0b56c;border-inline:2px solid #222}
.price{font-size:clamp(.85rem,4cqi,1.1rem);line-height:1.5;margin:0}
</style></head><body><h1>Healthy responsive card</h1><div class="carousel"><article class="card" data-pf-audit="carousel-card"><p class="heading">لوحة سيارات سعودية مميزة</p><div class="art" data-pf-proportional="plate"><span class="digits" data-pf-part="digits">١٢٣</span><span class="pillar" data-pf-part="pillar" aria-hidden="true"></span><span class="letters" data-pf-part="letters">أ ب ج</span></div><p class="price">السعر الحالي ١٢٠٠٠</p></article></div></body></html>
