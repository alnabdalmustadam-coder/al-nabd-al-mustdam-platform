<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;padding:2rem}button{padding:.8rem 1rem;border:0;border-radius:.5rem;background:#142a44;color:white}nav{margin-top:.5rem;padding:1rem;max-width:20rem;background:#eee;color:#123}</style></head><body><button type="button" data-pf-menu-trigger aria-expanded="false">القائمة</button><nav data-pf-menu-panel hidden><a href="#">المزادات</a></nav><script>const b=document.querySelector('button'),n=document.querySelector('nav');b.onclick=()=>{n.hidden=!n.hidden;b.setAttribute('aria-expanded',String(!n.hidden))};document.addEventListener('keydown',e=>{if(e.key==='Escape'){n.hidden=true;b.setAttribute('aria-expanded','false')}})</script></body></html>
